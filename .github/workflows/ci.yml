name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']

# Cancel superseded PR runs, but never on main, so every merged commit has a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Lint, test, frontend (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: '. -> target'

      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # The Tauri app (exile-companion) is a Windows target and is NOT built on Linux, so this job needs
      # no webkit/gtk system libraries. It covers the pure crates and the frontend.
      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (core, data, pob, engine, wiki, mcp)
        run: cargo clippy -p exile-core -p exile-data -p exile-pob -p exile-pob-engine -p exile-wiki -p exile-companion-mcp --all-targets -- -D warnings

      - uses: actions/cache@v6.1.0
        with:
          path: .pob
          key: pob-${{ hashFiles('tools/fetch-pob.sh') }}

      - name: Fetch Path of Building for the engine tests
        run: tools/fetch-pob.sh .pob

      - name: Test core, data, pob, engine, wiki, mcp
        run: cargo test -p exile-core -p exile-data -p exile-pob -p exile-pob-engine -p exile-wiki -p exile-companion-mcp
        env:
          EXILE_POB_DIR: ${{ github.workspace }}/.pob

      - name: ts-rs bindings are up to date
        run: |
          TS_RS_EXPORT_DIR="$PWD/app/ui/src/ipc/generated" cargo test -p exile-core --features ts
          if ! git diff --quiet -- app/ui/src/ipc/generated; then
            echo "::error::TypeScript IPC bindings are stale. Run 'pnpm gen:bindings' and commit."
            git diff -- app/ui/src/ipc/generated
            exit 1
          fi

      - name: Frontend lint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Frontend typecheck + build
        run: pnpm build

  windows-app:
    name: Tauri app compiles (Windows)
    # Already passed on the PR; Windows minutes count double, so main doesn't run it again.
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: '. -> target'

      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # generate_context! embeds the frontend, so dist/ must exist before compiling the app.
      - name: Build frontend
        run: pnpm build

      - name: clippy the Tauri app
        run: cargo clippy -p exile-companion --all-targets -- -D warnings

      - name: Build link download works with Windows TLS
        run: cargo test -p exile-companion -- --ignored downloads_a_build_over_tls

      - uses: actions/cache@v6.1.0
        with:
          path: .pob
          key: pob-${{ hashFiles('tools/fetch-pob.sh') }}

      # LuaJIT is built with MSVC here, and PoB gets Windows paths.
      - name: Fetch Path of Building for the engine tests
        shell: bash
        run: tools/fetch-pob.sh .pob

      - name: Engine runs PoB on Windows
        run: cargo test -p exile-pob-engine -p exile-companion-mcp
        env:
          EXILE_POB_DIR: ${{ github.workspace }}\.pob

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']

# Cancel superseded PR runs; never on main, so every merged commit has a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Lint, test, frontend (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: '. -> target'

      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # The Tauri app (poebo-app) is a Windows target and is NOT built on Linux, so this job needs
      # no webkit/gtk system libraries. It covers the pure crates and the frontend.
      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (core + data + pob)
        run: cargo clippy -p poebo-core -p poebo-data -p poebo-pob --all-targets -- -D warnings

      - name: Test core + data + pob
        run: cargo test -p poebo-core -p poebo-data -p poebo-pob

      - name: ts-rs bindings are up to date
        run: |
          TS_RS_EXPORT_DIR="$PWD/src/ipc/generated" cargo test -p poebo-core --features ts
          if ! git diff --quiet -- src/ipc/generated; then
            echo "::error::TypeScript IPC bindings are stale. Run 'pnpm gen:bindings' and commit."
            git diff -- src/ipc/generated
            exit 1
          fi

      - name: Frontend lint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Frontend typecheck + build
        run: pnpm build

  windows-app:
    name: Tauri app compiles (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: '. -> target'

      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # generate_context! embeds the frontend, so dist/ must exist before compiling the app.
      - name: Build frontend
        run: pnpm build

      - name: clippy the Tauri app
        run: cargo clippy -p poebo-app --all-targets -- -D warnings

      - name: Build link download works with Windows TLS
        run: cargo test -p poebo-app -- --ignored downloads_a_build_over_tls

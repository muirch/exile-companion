name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Lint, test, build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: '. -> target'

      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # The Tauri app crate embeds the frontend via generate_context!, so dist/ must exist
      # before compiling src-tauri.
      - name: Build frontend (typecheck + bundle)
        run: pnpm build

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (whole workspace, incl. the Tauri shell)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test core + data
        run: cargo test -p poebo-core -p poebo-data

      - name: ts-rs bindings are up to date
        run: |
          rm -rf src/ipc/generated
          TS_RS_EXPORT_DIR="$PWD/src/ipc/generated" cargo test -p poebo-core --features ts
          if ! git diff --quiet -- src/ipc/generated; then
            echo "::error::TypeScript IPC bindings are stale. Run 'pnpm gen:bindings' and commit."
            git diff -- src/ipc/generated
            exit 1
          fi

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: '. -> target'

      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build the Tauri app (NSIS + MSI installer)
        uses: tauri-apps/tauri-action@v0

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: poebo-windows-installer
          # src-tauri is a workspace member, so cargo builds into the workspace-root target/.
          # The src-tauri/target/ paths are kept as a fallback in case the layout differs.
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

name: Release (manual)

# Triggered manually only, so there is no tag spam during early development. Each run refreshes a
# single rolling "dev" pre-release with the latest Windows installer, ready to drop into a VM.
# Run it from the Actions tab: "Release (manual)" -> "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows dev build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: '. -> target'

      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # An installer run over the same version can keep the old exe, so each run gets its own.
      - name: Stamp the build version
        shell: bash
        run: sed -i 's/"version": "0\.1\.0"/"version": "0.1.${{ github.run_number }}"/' src-tauri/tauri.conf.json

      # Asset names carry the version now, so old installers would pile up on the release.
      - name: Remove old installers from the dev release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for asset in $(gh release view dev --json assets -q '.assets[].name' 2>/dev/null); do
            gh release delete-asset dev "$asset" -y
          done

      - name: Build installer and refresh the rolling dev pre-release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A single reusable tag/release; each run overwrites its installer assets.
          tagName: dev
          releaseName: Development build
          releaseBody: >
            Automated Windows build of the latest `main`. This is a rolling development
            pre-release, not a stable version. Grab the setup `.exe` below; it updates an
            existing install in place.
          releaseDraft: false
          prerelease: true

[workspace]
resolver = "2"
members = ["crates/poebo-core", "crates/poebo-data"]
# `src-tauri` is added to the workspace when the Tauri shell lands (build-order step 6).

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.92"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
tokio = { version = "1", default-features = false }

[profile.release]
strip = true
lto = "thin"

[workspace]
resolver = "2"
members = ["crates/core", "crates/data", "crates/pob", "crates/pob-engine", "crates/fetch", "crates/wiki", "app/desktop", "app/mcp"]
default-members = ["crates/core", "crates/data", "crates/pob", "crates/pob-engine", "crates/fetch", "crates/wiki", "app/mcp"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
time = { version = "=0.3.53", features = ["parsing", "formatting", "macros"] }
tokio = { version = "=1.53.0", default-features = false }

[profile.release]
strip = true
lto = "thin"

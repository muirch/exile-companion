[package]
name = "exile-companion"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The Exile Companion desktop app."

[lib]
name = "exile_companion"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-fs = "=2.5.1"
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-store = "=2.4.3"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-log = "=2.9.2"
log = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "=3.5.0", default-features = false, features = ["native-tls", "gzip"] }
tokio = { version = "=1.53.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
exile-core = { path = "../../crates/core" }
exile-data = { path = "../../crates/data" }
exile-pob = { path = "../../crates/pob" }
exile-pob-engine = { path = "../../crates/pob-engine", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "=0.13.2", features = ["xinput"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]  }

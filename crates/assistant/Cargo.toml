[package]
name = "exile-assistant"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
description = "The build assistant's chat: Claude over the Messages API with the player's own key, calling the tools of exile-companion-mcp."

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-child-process"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "=1.53.0", features = ["rt", "sync", "process", "time", "macros"] }
ureq = { version = "=3.5.0", default-features = false, features = ["native-tls", "gzip"] }

[dev-dependencies]
tokio = { version = "=1.53.0", features = ["rt-multi-thread", "macros"] }

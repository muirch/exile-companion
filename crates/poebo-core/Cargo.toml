[package]
name = "poebo-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pure, Tauri-free campaign logic for the poebo PoE1 leveling assistant."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
regex = "1"
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time", "macros"] }
tokio-util = "0.7"
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"

[dev-dependencies]
poebo-data = { path = "../poebo-data" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
tempfile = "3"

[package]
name = "poebo-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "poebo — Tauri v2 desktop shell for the PoE1 campaign assistant."

[lib]
name = "poebo_app"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-fs = "=2.5.1"
tauri-plugin-store = "=2.4.3"
tauri-plugin-window-state = "=2.4.1"
tauri-plugin-global-shortcut = "=2.3.2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "=1.53.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
poebo-core = { path = "../crates/poebo-core" }
poebo-data = { path = "../crates/poebo-data" }
